module_name: definitions
parameters:
- group: Rover Differential
  definitions:
    RD_WHEEL_TRACK:
      description:
        short: Wheel track
        long: Distance from the center of the right wheel to the center of the left
          wheel.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 100
      increment: 0.001
      decimal: 3
    RD_TRANS_TRN_DRV:
      description:
        short: Yaw error threshold to switch from spot turning to driving
      type: float
      default: 0.0872665
      unit: rad
      min: 0.001
      max: 3.14159
      increment: 0.01
      decimal: 3
    RD_TRANS_DRV_TRN:
      description:
        short: Yaw error threshold to switch from driving to spot turning
      type: float
      default: 0.174533
      unit: rad
      min: 0.001
      max: 3.14159
      increment: 0.01
      decimal: 3
    RD_YAW_STK_GAIN:
      description:
        short: Yaw stick gain for Manual mode
        long: Assign value below 1.0 to decrease stick response for yaw control.
      type: float
      default: 1.0
      min: 0.1
      max: 1
      increment: 0.01
      decimal: 3
