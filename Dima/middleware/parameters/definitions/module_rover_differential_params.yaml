module_name: definitions
parameters:
- group: Rover Differential
  definitions:
    RD_WHEEL_TRACK:
      description:
        short: 左右轮轮距
        long: |-
          右轮中心到左轮中心的距离。
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 100
      increment: 0.001
      decimal: 3
    RD_TRANS_TRN_DRV:
      category: Developer
      description:
        short: 从原地转向切换为行驶的偏航误差阈值
      type: float
      default: 0.0872665
      unit: rad
      min: 0.001
      max: 3.14159
      increment: 0.01
      decimal: 3
    RD_TRANS_DRV_TRN:
      category: Developer
      description:
        short: 从行驶切换为原地转向的偏航误差阈值
      type: float
      default: 0.174533
      unit: rad
      min: 0.001
      max: 3.14159
      increment: 0.01
      decimal: 3
    RD_YAW_STK_GAIN:
      category: Developer
      description:
        short: 手动模式偏航摇杆增益
        long: |-
          设为小于 1.0 的值可减弱偏航控制对摇杆输入的响应。
      type: float
      default: 1.0
      min: 0.1
      max: 1
      increment: 0.01
      decimal: 3
