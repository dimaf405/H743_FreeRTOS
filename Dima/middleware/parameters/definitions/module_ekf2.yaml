module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_PREDICT_US:
      category: Developer
      description:
        short: EKF 预测周期
        long: |-
          EKF 预测周期，单位为微秒。理想情况下应为 IMU 采样时间间隔的整数倍。
          滤波器实际更新周期会取 IMU 更新周期的整数倍。
      type: int32
      default: 10000
      min: 1000
      max: 20000
      unit: us
      reboot_required: true
    EKF2_DELAY_MAX:
      category: Developer
      description:
        short: 所有辅助传感器的最大延迟
        long: |-
          定义当前时刻与延迟融合时刻之间的时间差。
          此值应不小于所有 EKF2_XXX_DELAY 参数中的最大值。
      type: float
      default: 200
      min: 0
      max: 1000
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_ANGERR_INIT:
      category: Developer
      description:
        short: 重力向量对齐后的倾角不确定度（1σ）
      type: float
      default: 0.1
      min: 0.0
      max: 0.5
      unit: rad
      reboot_required: true
      decimal: 3
    EKF2_HDG_GATE:
      category: Developer
      description:
        short: 航向融合的新息门限
        long: |-
          设置新息一致性检查所使用的标准差倍数。
      type: float
      default: 2.6
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_HEAD_NOISE:
      category: Developer
      description:
        short: 磁航向融合的测量噪声
      type: float
      default: 0.3
      min: 0.01
      max: 1.0
      unit: rad
      decimal: 2
    EKF2_NOAID_NOISE:
      category: Developer
      description:
        short: 无辅助观测时位置保持的测量噪声
      type: float
      default: 10.0
      min: 0.5
      max: 50.0
      unit: m
      decimal: 1
    EKF2_NOAID_TOUT:
      category: Developer
      description:
        short: 最大惯性航位推算时间
        long: |-
          从最后一次融合能够约束速度漂移的观测开始计时，
          超过此时限后，EKF 将水平导航解标记为无效。
      type: int32
      default: 5000000
      min: 500000
      max: 10000000
      unit: us
- group: Compatibility
  definitions:
    # N1 只编译 GNSS 高度源；枚举不得暴露未接入的 Baro、Range 或 EV，
    # 避免 QGC 接受与实际 EKF2 编译闭包冲突的高度参考配置。
    EKF2_HGT_REF:
      category: System
      description:
        short: EKF 使用的 GNSS 高度参考
        long: |-
          Dima Rover 仅编译了 GNSS 高度源。气压、测距传感器及外部视觉的高度融合
          不在 N1 估计器功能范围内，因此此兼容值固定为 GPS。
      type: enum
      values:
        1: GPS
      default: 1
      reboot_required: true
- group: EKF2
  definitions:
    EKF2_IMU_CTRL:
      category: Developer
      description:
        short: IMU 融合与偏置估计控制
      type: bitmask
      bit:
        0: Gyro Bias
        1: Accel Bias
        2: Gravity vector fusion
      default: 7
      min: 0
      max: 7
    EKF2_GYR_NOISE:
      category: Developer
      description:
        short: 协方差预测使用的陀螺仪角速度噪声
      type: float
      default: 0.015
      min: 0.0001
      max: 0.1
      unit: rad/s
      decimal: 4
    EKF2_ACC_NOISE:
      category: Developer
      description:
        short: 协方差预测使用的加速度计噪声
      type: float
      default: 0.35
      min: 0.01
      max: 1.0
      unit: m/s^2
      decimal: 2
    EKF2_IMU_POS_X:
      description:
        short: IMU 在机体系中的 X 轴位置
        long: |-
          以车辆重心为原点，X 轴正方向朝前。
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_IMU_POS_Y:
      description:
        short: IMU 在机体系中的 Y 轴位置
        long: |-
          以车辆重心为原点，Y 轴正方向朝右。
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_IMU_POS_Z:
      description:
        short: IMU 在机体系中的 Z 轴位置
        long: |-
          以车辆重心为原点，Z 轴正方向朝下。
      type: float
      default: 0.0
      unit: m
      decimal: 3

    EKF2_TAU_VEL:
      category: Developer
      description:
        short: 速度输出预测与平滑滤波的时间常数
      type: float
      default: 0.25
      max: 1.0
      unit: s
      decimal: 2
    EKF2_TAU_POS:
      category: Developer
      description:
        short: 输出预测器的位置时间常数
        long: |-
          控制位置输出跟随 EKF 状态的紧密程度。
      type: float
      default: 0.25
      min: 0.1
      max: 1.0
      unit: s
      decimal: 2

    EKF2_VEL_LIM:
      category: Developer
      description:
        short: 速度上限
      type: float
      default: 100
      max: 299792458
      unit: m/s
      decimal: 1
