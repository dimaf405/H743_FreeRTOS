module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_ABIAS_INIT:
      category: Developer
      description:
        short: IMU 加速度计上电偏置不确定度（1σ）
      type: float
      default: 0.2
      min: 0.0
      max: 0.5
      unit: m/s^2
      reboot_required: true
      decimal: 2
    EKF2_ACC_B_NOISE:
      category: Developer
      description:
        short: IMU 加速度计偏置预测的过程噪声
      type: float
      default: 0.003
      min: 0.0
      max: 0.01
      unit: m/s^3
      decimal: 6
    EKF2_ABL_LIM:
      category: Developer
      description:
        short: 加速度计偏置学习限值
        long: |-
          EKF 加速度计偏置状态被限制在此值的正负范围内。
      type: float
      default: 0.4
      min: 0.0
      max: 0.8
      unit: m/s^2
      decimal: 2
    EKF2_ABL_ACCLIM:
      category: Developer
      description:
        short: 允许 IMU 偏置学习的最大加速度向量模长
        long: |-
          当 IMU 加速度向量模长超过此值时，暂停 EKF 加速度计偏置状态估计。
          这可减小大幅机动加速度、IMU 非线性及比例系数误差对偏置估计的不利影响。
      type: float
      default: 25.0
      min: 20.0
      max: 200.0
      unit: m/s^2
      decimal: 1
    EKF2_ABL_GYRLIM:
      category: Developer
      description:
        short: 允许 IMU 偏置学习的最大角速度向量模长
        long: |-
          当 IMU 角速度向量模长超过此值时，暂停 EKF 加速度计偏置状态估计。
          这可减小快速旋转及其相关误差对偏置估计的不利影响。
      type: float
      default: 3.0
      min: 2.0
      max: 20.0
      unit: rad/s
      decimal: 1
    EKF2_ABL_TAU:
      category: Developer
      description:
        short: 加速度计偏置学习抑制的时间常数
        long: |-
          判断是否暂停偏置学习时，对角速度和加速度向量模长应用带指数衰减的峰值保持滤波。
          此参数控制该指数衰减的时间常数。
      type: float
      default: 0.5
      min: 0.1
      max: 1.0
      unit: s
      decimal: 2
