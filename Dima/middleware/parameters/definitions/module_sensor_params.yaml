module_name: definitions
parameters:
- group: GPS
  definitions:
    GPS_1_PROTOCOL:
      description:
        short: Primary GPS protocol
        long: |-
          Auto detect and NMEA both use the PX4-compatible NMEA frontend with the
          CRC-validated Unicore AGRICA/UNIHEADINGA extension.
      type: enum
      values:
        0: Auto detect
        6: NMEA / Unicore UM982
      default: 6
    GPS_YAW_OFFSET:
      description:
        short: Heading/Yaw offset for dual antenna GPS
        long: |-
          Set this to zero when the antennas are parallel to vehicle forward and the
          Unicore primary antenna is in front. The offset increases clockwise.
      type: float
      default: 0.0
      unit: deg
      min: 0
      max: 360
      increment: 0.1
      decimal: 3
