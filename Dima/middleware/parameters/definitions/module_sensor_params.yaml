module_name: definitions
parameters:
- group: GPS
  definitions:
    GPS_YAW_OFFSET:
      category: System
      description:
        short: 双天线 GPS 航向/偏航偏移角
        long: |-
          当天线连线平行于车辆前向，且和芯星通主天线位于前方时，设为 0。
          偏移角按顺时针方向增大。
      type: float
      default: 0.0
      unit: deg
      min: 0
      max: 360
      increment: 0.1
      decimal: 3
    GPS_YAW_BASELINE:
      category: System
      description:
        short: 双天线实测基线长度
        long: |-
          经过稳健测量得到的两根 GNSS 天线之间的距离。
          0 表示尚未学习，并禁用运行期基线一致性检查；接收机仍会测量基线。
          此值用于本地检查，并不对应 UM982 配置命令。
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10
      increment: 0.001
      decimal: 3
- group: Sensor Calibration
  definitions:
    CAL_ACC0_ID:
      description:
        short: 加速度计 设备标识
      category: System
      type: int32
      default: 0
    CAL_ACC0_XOFF:
      description:
        short: 加速度计 X 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: m/s^2
      decimal: 3
    CAL_ACC0_YOFF:
      description:
        short: 加速度计 Y 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: m/s^2
      decimal: 3
    CAL_ACC0_ZOFF:
      description:
        short: 加速度计 Z 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: m/s^2
      decimal: 3
    CAL_ACC0_XSCALE:
      description:
        short: 加速度计 X 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_ACC0_YSCALE:
      description:
        short: 加速度计 Y 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_ACC0_ZSCALE:
      description:
        short: 加速度计 Z 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_GYRO0_ID:
      description:
        short: 陀螺仪 设备标识
      category: System
      type: int32
      default: 0
    CAL_GYRO0_XOFF:
      description:
        short: 陀螺仪 X 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: rad/s
      decimal: 3
    CAL_GYRO0_YOFF:
      description:
        short: 陀螺仪 Y 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: rad/s
      decimal: 3
    CAL_GYRO0_ZOFF:
      description:
        short: 陀螺仪 Z 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: rad/s
      decimal: 3
    CAL_MAG0_ID:
      description:
        short: 磁力计 设备标识
      category: System
      type: int32
      default: 0
    CAL_MAG0_XOFF:
      description:
        short: 磁力计 X 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: gauss
      decimal: 3
    CAL_MAG0_YOFF:
      description:
        short: 磁力计 Y 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: gauss
      decimal: 3
    CAL_MAG0_ZOFF:
      description:
        short: 磁力计 Z 轴偏移量
      category: System
      type: float
      default: 0.0
      unit: gauss
      decimal: 3
    CAL_MAG0_XSCALE:
      description:
        short: 磁力计 X 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_MAG0_YSCALE:
      description:
        short: 磁力计 Y 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_MAG0_ZSCALE:
      description:
        short: 磁力计 Z 轴比例系数
      category: System
      type: float
      default: 1.0
      min: 0.1
      max: 3.0
      decimal: 3
    CAL_MAG0_ROT:
      description:
        short: 磁力计安装旋转方向（PX4 旋转枚举）
      category: System
      type: enum
      values:
        0: No rotation
        1: Yaw 45 degrees
        2: Yaw 90 degrees
        3: Yaw 135 degrees
        4: Yaw 180 degrees
        5: Yaw 225 degrees
        6: Yaw 270 degrees
        7: Yaw 315 degrees
        8: Roll 180 degrees
        9: Roll 180, yaw 45 degrees
        10: Roll 180, yaw 90 degrees
        11: Roll 180, yaw 135 degrees
        12: Pitch 180 degrees
        13: Roll 180, yaw 225 degrees
        14: Roll 180, yaw 270 degrees
        15: Roll 180, yaw 315 degrees
        16: Roll 90 degrees
        17: Roll 90, yaw 45 degrees
        18: Roll 90, yaw 90 degrees
        19: Roll 90, yaw 135 degrees
        20: Roll 270 degrees
        21: Roll 270, yaw 45 degrees
        22: Roll 270, yaw 90 degrees
        23: Roll 270, yaw 135 degrees
        24: Pitch 90 degrees
        25: Pitch 270 degrees
        26: Pitch 180, yaw 90 degrees
        27: Pitch 180, yaw 270 degrees
        28: Roll 90, pitch 90 degrees
        29: Roll 180, pitch 90 degrees
        30: Roll 270, pitch 90 degrees
        31: Roll 90, pitch 180 degrees
        32: Roll 270, pitch 180 degrees
        33: Roll 90, pitch 270 degrees
        34: Roll 180, pitch 270 degrees
        35: Roll 270, pitch 270 degrees
        36: Roll 90, pitch 180, yaw 90 degrees
        37: Roll 90, yaw 270 degrees
        38: Roll 90, pitch 68, yaw 293 degrees
        39: Pitch 315 degrees
        40: Roll 90, pitch 315 degrees
      default: 0
      min: 0
      max: 40
- group: Sensors
  definitions:
    SENS_MAG_RATE:
      category: Developer
      description:
        short: 磁力计数据最大发布频率
        long: |-
          限制校准后 vehicle_magnetometer 数据的发布频率。
          原始 sensor_mag 流保持 DroneCAN 输入频率，用于来源识别和校准，
          与 PX4 的 SENS_MAG_RATE 数据流职责一致。此参数不配置远端节点的硬件采样率。
      type: float
      default: 15.0
      min: 1
      max: 200
      unit: Hz
    SENS_BOARD_ROT:
      description:
        short: 板载传感器安装旋转方向（PX4 旋转枚举）
      type: enum
      values:
        0: No rotation
        1: Yaw 45 degrees
        2: Yaw 90 degrees
        3: Yaw 135 degrees
        4: Yaw 180 degrees
        5: Yaw 225 degrees
        6: Yaw 270 degrees
        7: Yaw 315 degrees
        8: Roll 180 degrees
        9: Roll 180, yaw 45 degrees
        10: Roll 180, yaw 90 degrees
        11: Roll 180, yaw 135 degrees
        12: Pitch 180 degrees
        13: Roll 180, yaw 225 degrees
        14: Roll 180, yaw 270 degrees
        15: Roll 180, yaw 315 degrees
        16: Roll 90 degrees
        17: Roll 90, yaw 45 degrees
        18: Roll 90, yaw 90 degrees
        19: Roll 90, yaw 135 degrees
        20: Roll 270 degrees
        21: Roll 270, yaw 45 degrees
        22: Roll 270, yaw 90 degrees
        23: Roll 270, yaw 135 degrees
        24: Pitch 90 degrees
        25: Pitch 270 degrees
        26: Pitch 180, yaw 90 degrees
        27: Pitch 180, yaw 270 degrees
        28: Roll 90, pitch 90 degrees
        29: Roll 180, pitch 90 degrees
        30: Roll 270, pitch 90 degrees
        31: Roll 90, pitch 180 degrees
        32: Roll 270, pitch 180 degrees
        33: Roll 90, pitch 270 degrees
        34: Roll 180, pitch 270 degrees
        35: Roll 270, pitch 270 degrees
        36: Roll 90, pitch 180, yaw 90 degrees
        37: Roll 90, yaw 270 degrees
        38: Roll 90, pitch 68, yaw 293 degrees
        39: Pitch 315 degrees
        40: Roll 90, pitch 315 degrees
      default: 0
      min: 0
      max: 40
    SENS_BOARD_X_OFF:
      category: System
      description:
        short: 板载传感器横滚角微调
        long: |-
          在 SENS_BOARD_ROT 旋转之后应用的横滚角精细修正。
      type: float
      default: 0.0
      unit: deg
      min: -45
      max: 45
      increment: 0.1
      decimal: 2
    SENS_BOARD_Y_OFF:
      category: System
      description:
        short: 板载传感器俯仰角微调
        long: |-
          在 SENS_BOARD_ROT 旋转之后应用的俯仰角精细修正。
      type: float
      default: 0.0
      unit: deg
      min: -45
      max: 45
      increment: 0.1
      decimal: 2
    SENS_BOARD_Z_OFF:
      category: System
      description:
        short: 板载传感器偏航角微调
        long: |-
          在 SENS_BOARD_ROT 旋转之后应用的偏航角精细修正。
          由于重力无法观测偏航，自动水平校准会保留此值。
      type: float
      default: 0.0
      unit: deg
      min: -45
      max: 45
      increment: 0.1
      decimal: 2
    IMU_INTEG_RATE:
      category: Developer
      description:
        short: IMU 积分频率
        long: |-
          将校准后的原始 IMU 数据积分为角增量和速度增量的频率。
          所列频率是本产品针对固定 8 kHz ICM42688P FIFO 链路验证的工作档位。
          参数变更通过上锁状态下的传感器配置维护事务应用。
      type: enum
      values:
        100: 100 Hz
        200: 200 Hz
        250: 250 Hz
        400: 400 Hz
      default: 200
      min: 100
      max: 400
      unit: Hz
    SENS_IMU_AUTOCAL:
      description:
        short: IMU 自动校准
        long: |-
          当 EKF2 运行期偏置估计稳定且可用时，自动用其初始化 IMU 加速度计和陀螺仪校准。
      category: Developer
      type: boolean
      default: 1
    SENS_IMU_CLPNOTI:
      description:
        short: IMU 测量削顶通知
        long: |-
          积分后的加速度计或陀螺仪数据报告削顶时，按限频策略发出警告。
          此功能不会修改或丢弃样本。
      category: Developer
      type: boolean
      default: 1
