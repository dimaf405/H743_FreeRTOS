- group: Sensors
  definitions:
    SENS_MAG_RATE:
      description:
        short: Magnetometer maximum publication rate
        long: |-
          This limits the calibrated vehicle_magnetometer publication rate. The raw
          sensor_mag stream remains at the incoming DroneCAN rate for source
          detection and calibration, matching the PX4 SENS_MAG_RATE data-flow role.
          It does not configure the remote node's hardware sampling rate.
      type: float
      default: 15.0
      min: 1
      max: 200
      unit: Hz
    SENS_BOARD_ROT:
      description:
        short: Board sensor rotation using the PX4 rotation enum
      type: enum
      values:
        0: No rotation
        1: Yaw 45 degrees
        2: Yaw 90 degrees
        3: Yaw 135 degrees
        4: Yaw 180 degrees
        5: Yaw 225 degrees
        6: Yaw 270 degrees
        7: Yaw 315 degrees
        8: Roll 180 degrees
        9: Roll 180, yaw 45 degrees
        10: Roll 180, yaw 90 degrees
        11: Roll 180, yaw 135 degrees
        12: Pitch 180 degrees
        13: Roll 180, yaw 225 degrees
        14: Roll 180, yaw 270 degrees
        15: Roll 180, yaw 315 degrees
        16: Roll 90 degrees
        17: Roll 90, yaw 45 degrees
        18: Roll 90, yaw 90 degrees
        19: Roll 90, yaw 135 degrees
        20: Roll 270 degrees
        21: Roll 270, yaw 45 degrees
        22: Roll 270, yaw 90 degrees
        23: Roll 270, yaw 135 degrees
        24: Pitch 90 degrees
        25: Pitch 270 degrees
        26: Pitch 180, yaw 90 degrees
        27: Pitch 180, yaw 270 degrees
        28: Roll 90, pitch 90 degrees
        29: Roll 180, pitch 90 degrees
        30: Roll 270, pitch 90 degrees
        31: Roll 90, pitch 180 degrees
        32: Roll 270, pitch 180 degrees
        33: Roll 90, pitch 270 degrees
        34: Roll 180, pitch 270 degrees
        35: Roll 270, pitch 270 degrees
        36: Roll 90, pitch 180, yaw 90 degrees
        37: Roll 90, yaw 270 degrees
        38: Roll 90, pitch 68, yaw 293 degrees
        39: Pitch 315 degrees
        40: Roll 90, pitch 315 degrees
      default: 0
      min: 0
      max: 40
    IMU_INTEG_RATE:
      description:
        short: IMU integration rate
        long: |-
          Rate at which calibrated raw IMU data is integrated into delta angle and
          delta velocity. The listed rates are the modes verified against the fixed
          8 kHz ICM42688P FIFO path in this product. Changes are applied by the
          disarmed sensor-configuration maintenance transaction.
      type: enum
      values:
        100: 100 Hz
        200: 200 Hz
        250: 250 Hz
        400: 400 Hz
      default: 200
      min: 100
      max: 400
      unit: Hz
    SENS_IMU_CLPNOTI:
      description:
        short: IMU clipping notification
        long: |-
          Emit a rate-limited warning when integrated accelerometer or gyroscope data
          reports clipping. This does not alter or discard samples.
      category: System
      type: boolean
      default: 1
