- group: PWM Outputs
  definitions:
    PWM_S1_FUNC:
      description:
        short: PWM S1 function
      type: enum
      values:
        0: Disabled
        101: Motor right
        102: Motor left
      default: 0
    PWM_S1_MIN:
      category: System
      description:
        short: PWM S1 minimum pulse
      type: int32
      default: 1000
      unit: us
      min: 500
      max: 2500
      increment: 1
    PWM_S1_CENT:
