- group: Rover Differential
  definitions:
    RO_CMD_TIMEOUT:
      description:
        short: 车辆运动请求超时
        long: |-
          运动请求的发布时间及其输入样本的最大允许时龄。
      type: float
      default: 0.1
      unit: s
      min: 0.02
      max: 1.0
      increment: 0.01
      decimal: 2
    RD_REV_STEER:
      category: Developer
      description:
        short: 手动模式倒车转向反转
        long: |-
          倒车时保持所请求的车头转向符合直观操作习惯。
      type: int32
      default: 1
      min: 0
      max: 1
    RD_STR_THR_MIX:
      category: Developer
      description:
        short: 输出饱和时转向与油门的优先级
        long: |-
          0 表示优先保留纵向命令；0.5 表示两轴按相同比例缩放；
          1 表示优先保留转向命令。
      type: float
      default: 0.5
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
- group: Rover Motors
  definitions:
    MOT_THR_MIN:
      category: System
      description:
        short: 最小非零电机输出
        long: |-
          仅在电机命令非零时应用静摩擦补偿。此参数不是遥控输入死区。
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_MAX:
      description:
        short: 最大电机输出
      type: float
      default: 1.0
      min: 0.05
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_SLEW_RATE:
      category: System
      description:
        short: 纵向命令变化率
        long: |-
          设为 0 时禁用变化率限制。
      type: float
      default: 1.0
      unit: 1/s
      min: 0.0
      max: 10.0
      increment: 0.05
      decimal: 2
    MOT_REV_DELAY:
      description:
        short: 单侧电机换向延迟
        long: |-
          左右两侧独立处理：接受反向命令之前，先保持一段时间的零输出。
      type: float
      default: 0.2
      unit: s
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_EXPO:
      category: System
      description:
        short: 电机推力曲线指数系数
        long: |-
          0 表示线性响应；正值补偿低输出段动力不足；负值减弱低输出段响应。
      type: float
      default: 0.0
      min: -1.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_ASYM:
      category: System
      description:
        short: 前进与后退推力不对称系数
        long: |-
          大于 1 时，在最终限幅之前增大负向电机命令的幅值。
      type: float
      default: 1.0
      min: 1.0
      max: 10.0
      increment: 0.05
      decimal: 2
    MOT_ARM_RAMP:
      description:
        short: 解锁后的电机输出渐增时间
      type: float
      default: 0.5
      unit: s
      min: 0.0
      max: 5.0
      increment: 0.05
      decimal: 2
