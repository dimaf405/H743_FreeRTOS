module_name: definitions
parameters:
- group: PWM Outputs
  definitions:
    PWM_S1_FUNC:
      description:
        short: PWM S1 输出功能
        long: |-
          按面向车头的车辆左右侧分配逻辑电机。侧别与电机安装方向独立；正命令必须使该侧车轮驱动车辆前进。
      type: enum
      values:
        0: Disabled
        101: Motor right
        102: Motor left
      default: 0
    PWM_S1_MIN:
      category: System
      description:
        short: PWM S1 最小脉宽
      type: int32
      default: 1000
      unit: us
      min: 500
      max: 2500
      increment: 1
    PWM_S1_CENT:
      category: System
      description:
        short: PWM S1 中位脉宽
        long: |-
          零命令和普通未解锁状态输出此脉宽；必须满足 MIN < CENT < MAX，并与电调真实停止中位一致。
      type: int32
      default: 1500
      unit: us
      min: 500
      max: 2500
      increment: 1
    PWM_S1_MAX:
      category: System
      description:
        short: PWM S1 最大脉宽
      type: int32
      default: 2000
      unit: us
      min: 500
      max: 2500
      increment: 1
    PWM_S1_REV:
      description:
        short: PWM S1 输出方向反转
        long: |-
          只反转本输出通道的前后方向，中位不变。左右侧 FUNC 正确后，用本项匹配电机安装方向；不要用左右互换代替方向校准。
      type: enum
      values:
        0: Normal
        1: Reversed
      default: 0
      min: 0
      max: 1
