- group: Rover Differential
  definitions:
    RO_CMD_TIMEOUT:
      description:
        short: Rover motion request timeout
        long: Maximum age of both the request publication and its input sample.
      type: float
      default: 0.1
      unit: s
      min: 0.02
      max: 1.0
      increment: 0.01
      decimal: 2
    RD_REV_STEER:
      category: Developer
      description:
        short: Reverse steering in Manual mode
        long: Keeps the commanded vehicle nose direction intuitive while reversing.
      type: int32
      default: 1
      min: 0
      max: 1
    RD_STR_THR_MIX:
      category: Developer
      description:
        short: Steering versus throttle saturation priority
        long: |-
          0 preserves longitudinal command, 0.5 scales both axes proportionally,
          and 1 preserves steering command.
      type: float
      default: 0.5
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
- group: Rover Motors
  definitions:
    MOT_THR_MIN:
      category: System
      description:
        short: Minimum nonzero motor output
        long: |-
          Static-friction compensation applied only after a nonzero motor command.
          This is not an RC input deadzone.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_MAX:
      description:
        short: Maximum motor output
      type: float
      default: 1.0
      min: 0.05
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_SLEW_RATE:
      category: System
      description:
        short: Longitudinal command slew rate
        long: A value of zero disables slew limiting.
      type: float
      default: 1.0
      unit: 1/s
      min: 0.0
      max: 10.0
      increment: 0.05
      decimal: 2
    MOT_REV_DELAY:
      description:
        short: Per-side motor reversal delay
        long: Each side independently holds zero before accepting the opposite sign.
      type: float
      default: 0.2
      unit: s
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_EXPO:
      category: System
      description:
        short: Motor thrust curve expo
        long: |-
          Zero is linear. Positive values compensate a weak low end; negative values
          reduce low-end response.
      type: float
      default: 0.0
      min: -1.0
      max: 1.0
      increment: 0.01
      decimal: 2
    MOT_THR_ASYM:
      category: System
      description:
        short: Forward to reverse thrust asymmetry
        long: Values above one increase negative motor commands before final limiting.
      type: float
      default: 1.0
      min: 1.0
      max: 10.0
      increment: 0.05
      decimal: 2
    MOT_ARM_RAMP:
      description:
        short: Motor output ramp after arming
      type: float
      default: 0.5
      unit: s
      min: 0.0
      max: 5.0
      increment: 0.05
      decimal: 2
