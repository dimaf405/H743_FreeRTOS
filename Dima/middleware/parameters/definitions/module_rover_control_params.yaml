module_name: definitions
parameters:
- group: Pure Pursuit
  definitions:
    PP_LOOKAHD_GAIN:
      category: System
      description:
        short: 纯追踪控制器前视距离增益
        long: |-
          较小的值会使路径跟踪更激进，并可能增大超调或振荡。
      type: float
      default: 1.0
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
    PP_LOOKAHD_MIN:
      category: Developer
      description:
        short: 纯追踪控制器最小前视距离
      type: float
      default: 1.0
      unit: m
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
    PP_LOOKAHD_MAX:
      category: Developer
      description:
        short: 纯追踪控制器最大前视距离
      type: float
      default: 10.0
      unit: m
      min: 0.1
      max: 100
      increment: 0.01
      decimal: 2
- group: Rover Navigation
  definitions:
    NAV_ACC_RAD:
      description:
        short: 默认航点到达判定半径
        long: |-
          当任务航点未提供大于 0 的独立到达半径时，使用此值。
      type: float
      default: 0.5
      unit: m
      min: 0.1
      max: 100
      increment: 0.1
      decimal: 2
- group: Rover Attitude Control
  definitions:
    RO_YAW_P:
      category: System
      description:
        short: 偏航角闭环控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
- group: Rover Rate Control
  definitions:
    RO_YAW_STICK_DZ:
      category: Developer
      description:
        short: 偏航摇杆中位死区
        long: |-
          以摇杆输入范围的比例表示；中位附近落入此范围的输入按零处理。
      type: float
      default: 0.1
      min: 0
      max: 1
      increment: 0.01
      decimal: 2
    RO_YAW_EXPO:
      category: Developer
      description:
        short: 偏航角速度输入曲线指数系数
        long: |-
          用于调整输入曲线形状。
          0：纯线性输入曲线。
          1：纯三次输入曲线。
      type: float
      default: 0.0
      min: 0
      max: 1
      decimal: 2
    RO_YAW_SUPEXPO:
      category: Developer
      description:
        short: 偏航角速度输入曲线超指数系数
        long: |-
          在 RO_YAW_EXPO 调整的基础上，进一步修正输入曲线形状。
          0：仅使用原指数曲线。
          0.7：适度增强曲线形状，使摇杆手感更直观。
          0.95：曲线弯曲很强，仅接近最大行程的输入才有明显作用。
      type: float
      default: 0.0
      min: 0
      max: 0.95
      decimal: 2
    RO_YAW_RATE_TH:
      category: System
      description:
        short: 偏航角速度测量阈值
        long: |-
          实测偏航角速度及限幅后设定值的绝对值不大于此阈值时按零处理。
      type: float
      default: 3.0
      unit: deg/s
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_YAW_RATE_P:
      category: System
      description:
        short: 偏航角速度闭环控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
    RO_YAW_RATE_I:
      category: System
      description:
        short: 偏航角速度闭环控制器积分增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 3
    RO_YAW_RATE_LIM:
      description:
        short: 偏航角速度上限
        long: |-
          限制偏航角速度设定值；在特技、增稳和位置模式中，
          还用于将控制输入映射为偏航角速度设定值。
      type: float
      default: 0.0
      unit: deg/s
      min: 0
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_ACCEL_LIM:
      description:
        short: 偏航角加速度上限
        long: |-
          限制偏航角速度设定值幅值的增大速率。设为 -1 时禁用。
      type: float
      default: -1.0
      unit: deg/s^2
      min: -1
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_DECEL_LIM:
      description:
        short: 偏航角减速度上限
        long: |-
          限制偏航角速度设定值幅值的减小速率。设为 -1 时禁用。
      type: float
      default: -1.0
      unit: deg/s^2
      min: -1
      max: 10000
      increment: 0.01
      decimal: 2
    RO_YAW_RATE_CORR:
      category: System
      description:
        short: 偏航角速度前馈修正系数
        long: |-
          偏航角速度控制器前馈映射使用的乘法修正系数。
          实测角速度小于设定值时增大此值（x > 1），反之减小（0 < x < 1）。
          此项尤其适用于滑移转向车辆，或因车轮/转向轴不对齐而导致转向摩擦较大的车辆。
      type: float
      default: 1.0
      min: 0.01
      max: 10000
      increment: 0.01
      decimal: 2
- group: Rover Auto Calibration
  definitions:
    RO_CAL_RADIUS:
      description:
        short: 自动校准位置约束半径
        long: |-
          以进入校准时记录的 GNSS 位置为圆心的水平半径，整个会话中圆心保持固定。
          仅约束定位参考点，不覆盖车辆的完整外廓。
          定位不确定度、延迟和停车距离都会压缩可用空间。
      type: float
      default: 20.0
      min: 1
      max: 100
      unit: m
      increment: 0.5
      decimal: 1
    RO_CAL_VMAX:
      description:
        short: 自动校准备用速度上限
        long: |-
          进入校准时若 RO_SPEED_LIM 为 0 或旧值 -1，则将此值冻结为地速上限。
          巡航速度未配置时会请求逐步增加的满输出探测，速度仍受限制。
          停车距离必须覆盖该速度及允许的驱动输出。
      type: float
      default: 1.5
      min: 0.1
      max: 100
      unit: m/s
      decimal: 2
    RO_CAL_STOP_D:
      description:
        short: 经过实测确认的校准停车距离
        long: |-
          在当前载荷、地面条件和允许的校准运动范围内，发出停车请求后，
          定位参考点可能继续移动的保守最大距离，须计入执行器响应和车辆惯性。
          0 表示未知，会禁止所有自动校准运动。
          这是安全输入，与所请求的 RO_DECEL_LIM 减速度限值不同。
      type: float
      default: 0.0
      min: 0
      max: 100
      unit: m
      increment: 0.1
      decimal: 2
    RO_CAL_THR_MAX:
      category: Developer
      description:
        short: 自动校准油门上限
        long: |-
          自动校准使用的最大归一化纵向请求。巡航速度未配置时，
          经独立条件门控的满输出探测改用 MOT_THR_MAX，其他阶段仍遵守此上限。
          运行期安全逻辑还会施加不可绕过的硬上限及实测地速限制。
      type: float
      default: 0.30
      min: 0.10
      max: 0.40
      increment: 0.01
      decimal: 2
    RO_CAL_TURN_MAX:
      category: Developer
      description:
        short: 自动校准转向上限
        long: |-
          校准转弯和闭环增益验证使用的归一化转向请求最大绝对值。
          每次会话期间保持冻结。
      type: float
      default: 0.25
      min: 0.10
      max: 0.35
      increment: 0.01
      decimal: 2
- group: Rover Velocity Control
  definitions:
    RO_MAX_THR_SPEED:
      category: System
      description:
        short: 车辆在最大油门下的行驶速度
        long: |-
          用于将速度 [m/s] 线性映射为油门值 [-1, 1]。
      type: float
      default: 0.0
      min: 0
      max: 100
      unit: m/s
      increment: 0.01
      decimal: 2
    RO_SPEED_P:
      category: System
      description:
        short: 地速控制器比例增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_I:
      category: System
      description:
        short: 地速控制器积分增益
      type: float
      default: 0.0
      min: 0
      max: 100
      increment: 0.001
      decimal: 3
    RO_SPEED_LIM:
      description:
        short: 导航巡航速度
        long: |-
          导航使用的巡航速度。0 表示未配置；进入校准时，旧值 -1 也按未配置处理。
          自动校准将进入时的正值冻结为速度上限，否则使用 RO_CAL_VMAX。
      type: float
      default: 0.0
      unit: m/s
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_ACCEL_LIM:
      description:
        short: 加速度上限
        long: |-
          设为 -1 时禁用。对于麦克纳姆轮车辆，此限制同时用于纵向和横向加速度。
      type: float
      default: -1.0
      unit: m/s^2
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_DECEL_LIM:
      description:
        short: 减速度上限
        long: |-
          设为 -1 时禁用。禁用后，车辆在自动模式下接近航点时不会减速。
          对于麦克纳姆轮车辆，此限制同时用于纵向和横向减速度。
      type: float
      default: -1.0
      unit: m/s^2
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_JERK_LIM:
      category: Developer
      description:
        short: 加加速度上限
        long: |-
          设为 -1 时禁用。禁用后，车辆在自动模式下接近航点时不会减速。
          对于麦克纳姆轮车辆，此限制同时用于纵向和横向加加速度。
      type: float
      default: -1.0
      unit: m/s^3
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_TH:
      category: System
      description:
        short: 速度测量阈值
        long: |-
          实测速度的绝对值不大于此阈值时按零处理。此参数只接受非负值，
          设为 0 时不再抑制非零速度测量；不会截断速度设定值。
      type: float
      default: 0.1
      unit: m/s
      min: 0
      max: 100
      increment: 0.01
      decimal: 2
    RO_SPEED_RED:
      category: Developer
      description:
        short: 根据航迹方向误差减速的增益
        long: |-
          降速后速度 = RO_MAX_THR_SPEED ×（1 - 归一化航迹方向误差 × RO_SPEED_RED）。
          归一化航迹方向误差为当前航迹方向与目标方位之间的夹角，
          从 [0, 180] 度线性映射到 [0, 1]。值越大，减速越明显。
          此项也用于计算自动模式下车辆到达航点时的速度。
          设为 -1 时禁用基于方向误差的减速。
      type: float
      default: -1.0
      min: -1
      max: 100
      increment: 0.01
      decimal: 2
