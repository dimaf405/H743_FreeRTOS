module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_GBIAS_INIT:
      category: Developer
      description:
        short: IMU 陀螺仪上电偏置不确定度（1σ）
      type: float
      default: 0.1
      min: 0.0
      max: 0.2
      unit: rad/s
      reboot_required: true
      decimal: 2
    EKF2_GYR_B_NOISE:
      category: Developer
      description:
        short: IMU 陀螺仪角速度偏置预测的过程噪声
      type: float
      default: 0.001
      min: 0.0
      max: 0.01
      unit: rad/s^2
      decimal: 6
    EKF2_GYR_B_LIM:
      category: Developer
      description:
        short: 陀螺仪偏置学习限值
        long: |-
          EKF 陀螺仪偏置状态被限制在此值的正负范围内。
      type: float
      default: 0.15
      min: 0.0
      max: 0.4
      unit: rad/s
      decimal: 3
