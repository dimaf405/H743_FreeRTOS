module_name: Dataman

parameters:
  - group: System
    definitions:
      SYS_DM_BACKEND:
        category: Developer
        description:
          short: 任务数据存储后端
          long: |-
            若板级支持持久化存储，默认存储使用板级存储；
            否则使用不具备持久化能力的 RAM 存储。
        type: enum
        values:
          -1: Dataman disabled
          0: Default storage
          1: RAM storage
        default: 0
        min: -1
        max: 1
        reboot_required: true
