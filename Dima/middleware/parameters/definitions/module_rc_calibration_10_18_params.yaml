module_name: definitions
parameters:
- group: Radio Calibration
  definitions:
    RC10_MIN:
      category: System
      description:
        short: 遥控通道 10 的最小输入值
      type: float
      default: 1000.0
      unit: us
      min: 800
      max: 1500
    RC10_TRIM:
      category: System
      description:
        short: 遥控通道 10 的中位校准值
      type: float
      default: 1500.0
      unit: us
      min: 800
      max: 2200
    RC10_MAX:
      category: System
      description:
        short: 遥控通道 10 的最大输入值
      type: float
      default: 2000.0
      unit: us
      min: 1500
      max: 2200
    RC10_REV:
      category: System
      description:
        short: 遥控通道 10 的输入方向反转
      type: float
      values:
        -1: Reverse
        1: Normal
      default: 1.0
      min: -1
      max: 1
    RC10_DZ:
      category: System
      description:
        short: 遥控通道 10 的中位死区
      type: float
      default: 0.0
      unit: us
      min: 0
      max: 500
