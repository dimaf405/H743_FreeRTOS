module_name: DroneCAN Configuration

parameters:
  - group: UAVCAN
    definitions:
      UAVCAN1_ENABLE:
        description:
          short: FDCAN1 的 DroneCAN 工作模式
          long: |-
            自动模式启用 Dima 集中式动态节点 ID 分配器。
            当前未实现固件更新服务。
        type: enum
        default: 2
        min: 0
        max: 2
        values:
          0: Disabled
          1: Sensors Manual Config
          2: Sensors Automatic Node Allocation
      UAVCAN1_BITRATE:
        description:
          short: FDCAN1 的 DroneCAN 标称位速率
        type: enum
        default: 500000
        unit: bit/s
        values:
          125000: 125 kbit/s
          250000: 250 kbit/s
          500000: 500 kbit/s
          1000000: 1 Mbit/s
      UAVCAN1_NODE_ID:
        description:
          short: 控制器使用的静态 DroneCAN 节点 ID
        type: int32
        default: 1
        min: 1
        max: 125
