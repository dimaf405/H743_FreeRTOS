module_name: definitions
# 固定值也可能是官方 QGC 的直接 Fact 依赖，不能仅按“无可选动作”删除。
# System 分类只整理展示；合法取值、消费者和故障关闭行为保持不变。
parameters:
- group: Compatibility
  definitions:
    NAV_RCL_ACT:
      category: System
      description:
        short: 遥控信号丢失时的动作
        long: |-
          当前 Commander 在遥控信号丢失时通过上锁进入安全状态。
          其他 PX4 动作依赖本产品尚未提供的导航或降落能力。
      type: enum
      values:
        6: Disarm
      default: 6
      min: 6
      max: 6
    NAV_DLL_ACT:
      category: System
      description:
        short: 地面站数据链丢失时的动作
        long: |-
          当前阶段 USB/地面站不是 Dima 的控制来源，断开连接不会触发导航动作。
      type: enum
      values:
        0: Disabled
      default: 0
      min: 0
      max: 0
    COM_LOW_BAT_ACT:
      category: System
      description:
        short: 低电量动作兼容值
        long: |-
          当前阶段仅用于界面兼容，尚未实现电池检测或低电量动作。
      type: enum
      values:
        0: No implemented action
      default: 0
      min: 0
      max: 0
    MAV_SYS_ID:
      category: System
      description:
        short: MAVLink 系统 ID
        long: |-
          当前 Dima 的所有协议编码器和目标过滤器均使用固定的系统/组件标识 1/1。
      type: int32
      default: 1
      min: 1
      max: 1
      reboot_required: true
    SYS_AUTOSTART:
      category: System
      description:
        short: 兼容 PX4 的机架标识
        long: |-
          Dima 是固定的差速车产品。该值与 PX4 的通用差速车机架一致，
          但不会启用运行期机架选择或 PX4 启动脚本。
      type: enum
      values:
        50000: Generic Rover Differential
      default: 50000
      min: 50000
      max: 50000
    SYS_AUTOCONFIG:
      category: System
      description:
        short: PX4 机架自动配置请求
        long: |-
          Dima 不提供 PX4 机架默认值配置事务。固定值 0 表示保留当前产品配置；
          写入 1 的请求会被拒绝。
      type: enum
      values:
        0: Keep current product configuration
      default: 0
      min: 0
      max: 0
