module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_MAG_TYPE:
      category: Developer
      description:
        short: 磁力计融合类型
        long: |-
          选择磁航向融合或三轴磁场向量融合等方式。
          三轴向量融合可学习固定在车体上的硬铁误差，但要求地磁场稳定。
          自动（Automatic）：在地面使用磁航向融合，在空中使用三轴磁场融合。
          磁航向（Magnetic heading）：始终使用磁航向融合。
          禁用（None）：任何情况下均不使用磁力计。若没有外部偏航源，
          可结合起飞后的水平运动与 GNSS 速度测量对齐偏航角。
          仅初始化（Init）：仅使用磁力计初始化航向。
      type: enum
      values:
        0: Automatic
        1: Magnetic heading
        5: None
        6: Init
      default: 0
      reboot_required: true
    EKF2_MAG_DELAY:
      category: Developer
      description:
        short: 磁力计测量相对于 IMU 测量的延迟
      type: float
      default: 0
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_MAG_GATE:
      category: Developer
      description:
        short: 磁力计 XYZ 分量融合的新息门限
        long: |-
          设置新息一致性检查所使用的标准差倍数。
      type: float
      default: 3.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_MAG_NOISE:
      category: Developer
      description:
        short: 磁力计三轴融合的测量噪声
      type: float
      default: 0.05
      min: 0.001
      max: 1.0
      unit: gauss
      decimal: 3
    EKF2_MAG_B_NOISE:
      category: Developer
      description:
        short: 机体系磁场预测的过程噪声
      type: float
      default: 0.0001
      min: 0.0
      max: 0.1
      unit: gauss/s
      decimal: 6
    EKF2_MAG_E_NOISE:
      category: Developer
      description:
        short: 地磁场预测的过程噪声
      type: float
      default: 0.001
      min: 0.0
      max: 0.1
      unit: gauss/s
      decimal: 6
    EKF2_DECL_TYPE:
      category: Developer
      description:
        short: 磁偏角处理方式位掩码
        long: |-
          将对应位置的位设为 1 可启用相应功能：
          位 0：GPS 位置可用后使用 geo_lookup 库提供的磁偏角；
          未设置此位时始终使用 EKF2_MAG_DECL。
          位 1：车辆上锁时，将 EKF 返回的磁偏角保存到 EKF2_MAG_DECL。
      type: bitmask
      bit:
        0: use geo_lookup declination
        1: save EKF2_MAG_DECL on disarm
      default: 3
      min: 0
      max: 3
      reboot_required: true
    EKF2_MAG_ACCLIM:
      category: Developer
      description:
        short: 航向可观测性检查的水平加速度阈值
        long: |-
          当全局位置/速度辅助源生效，且机体加速度超过此值时，认为航向可观测。
      type: float
      default: 0.5
      min: 0.0
      max: 5.0
      unit: m/s^2
      decimal: 2
    EKF2_MAG_CHECK:
      category: Developer
      description:
        short: 磁场有效性检查选择
        long: |-
          通过位掩码选择用于判断磁力计数据是否有效的检查，可抑制偶发硬铁干扰。
          收到 GNSS 数据时，与世界磁场模型（WMM）比较；否则使用平均参考值。
          将对应位置的位设为 1 可启用检查：
          位 0：磁场强度检查，容差由 EKF2_MAG_CHK_STR 设置。
          位 1：磁倾角检查，容差由 EKF2_MAG_CHK_INC 设置。
          位 2：等待 GNSS 数据，以便通过 WMM 获取理论磁场强度和磁倾角。
      type: bitmask
      bit:
        0: Strength (EKF2_MAG_CHK_STR)
        1: Inclination (EKF2_MAG_CHK_INC)
        2: Wait for WMM
      default: 1
      min: 0
      max: 7
    EKF2_MAG_CHK_STR:
      category: Developer
      description:
        short: 磁场强度检查容差
        long: |-
          通过检查所允许的实测磁场强度与预期值之间的最大偏差。
      type: float
      default: 0.2
      min: 0.0
      max: 1.0
      unit: gauss
      decimal: 2
    EKF2_MAG_CHK_INC:
      category: Developer
      description:
        short: 磁倾角检查容差
        long: |-
          通过检查所允许的实测磁倾角与预期值之间的最大偏差。
      type: float
      default: 20.0
      min: 0.0
      max: 90.0
      unit: deg
      decimal: 1
    EKF2_SYNT_MAG_Z:
      category: Developer
      description:
        short: 启用磁力计 Z 轴合成测量
        long: |-
          适用于机体系 Z 轴磁场测量受到强磁干扰的载具。
          磁航向融合时，使用当前位置的三维磁场向量计算合成值，替代实测 Z 轴磁场；
          因此只有已知全局位置时，此参数才生效。
          三轴磁场融合时直接忽略 Z 轴测量，不融合该合成值。
      type: boolean
      default: 0
