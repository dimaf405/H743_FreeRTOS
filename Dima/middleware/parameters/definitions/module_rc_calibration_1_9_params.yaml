module_name: definitions
parameters:
- group: Radio Calibration
  definitions:
    RC1_MIN:
      category: System
      description:
        short: 遥控通道 1 的最小输入值
      type: float
      default: 1000.0
      unit: us
      min: 800
      max: 1500
    RC1_TRIM:
      category: System
      description:
        short: 遥控通道 1 的中位校准值
      type: float
      default: 1500.0
      unit: us
      min: 800
      max: 2200
    RC1_MAX:
      category: System
      description:
        short: 遥控通道 1 的最大输入值
      type: float
      default: 2000.0
      unit: us
      min: 1500
      max: 2200
    RC1_REV:
      category: System
      description:
        short: 遥控通道 1 的输入方向反转
      type: float
      values:
        -1: Reverse
        1: Normal
      default: 1.0
      min: -1
      max: 1
    RC1_DZ:
      category: System
      description:
        short: 遥控通道 1 的中位死区
      type: float
      default: 0.0
      unit: us
      min: 0
      max: 500
