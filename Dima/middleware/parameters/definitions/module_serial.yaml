module_name: Serial Configuration

parameters:
  - group: Serial
    definitions:
      SERIAL1_BAUD:
        description:
          short: SERIAL1（USART1 PA9/PA10）波特率
          long: |-
            SERIAL1 直接映射到物理串口 USART1，引脚为 PA9/PA10。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 921600
        values: &serial_baud_values
          0: Auto
          2400: 2400 8N1
          4800: 4800 8N1
          9600: 9600 8N1
          19200: 19200 8N1
          38400: 38400 8N1
          57600: 57600 8N1
          115200: 115200 8N1
          230400: 230400 8N1
          460800: 460800 8N1
          500000: 500000 8N1
          921600: 921600 8N1
          1000000: 1000000 8N1
          1500000: 1500000 8N1
          2000000: 2000000 8N1
          3000000: 3000000 8N1
      SERIAL1_FUNCTION:
        description:
          short: SERIAL1（USART1 PA9/PA10）功能分配
          long: |-
            选择物理串口 USART1 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: &serial_function_values
          0: Disabled
          1: SBUS
          2: GPS

      SERIAL2_BAUD:
        description:
          short: SERIAL2（USART2 PD5/PD6）波特率
          long: |-
            SERIAL2 直接映射到物理串口 USART2，引脚为 PD5/PD6。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 0
        values: *serial_baud_values
      SERIAL2_FUNCTION:
        description:
          short: SERIAL2（USART2 PD5/PD6）功能分配
          long: |-
            选择物理串口 USART2 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: *serial_function_values

      SERIAL3_BAUD:
        description:
          short: SERIAL3（USART3 PD8/PD9）波特率
          long: |-
            SERIAL3 直接映射到物理串口 USART3，引脚为 PD8/PD9。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 0
        values: *serial_baud_values
      SERIAL3_FUNCTION:
        description:
          short: SERIAL3（USART3 PD8/PD9）功能分配
          long: |-
            选择物理串口 USART3 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: *serial_function_values

      SERIAL4_BAUD:
        description:
          short: SERIAL4（UART4 PB9/PB8）波特率
          long: |-
            SERIAL4 直接映射到物理串口 UART4，引脚为 PB9/PB8。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 115200
        values: *serial_baud_values
      SERIAL4_FUNCTION:
        description:
          short: SERIAL4（UART4 PB9/PB8）功能分配
          long: |-
            选择物理串口 UART4 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: *serial_function_values

      SERIAL6_BAUD:
        description:
          short: SERIAL6（USART6 PC6/PC7）波特率
          long: |-
            SERIAL6 直接映射到物理串口 USART6，引脚为 PC6/PC7。
            此值是 SBUS 驱动释放端口后恢复使用的普通 8N1 波特率。
        type: enum
        default: 0
        values: *serial_baud_values
      SERIAL6_FUNCTION:
        description:
          short: SERIAL6（USART6 PC6/PC7）功能分配
          long: |-
            选择物理串口 USART6 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            本产品默认将 USART6 分配给 SBUS。
        type: enum
        default: 1
        values: *serial_function_values

      SERIAL7_BAUD:
        description:
          short: SERIAL7（UART7 PE8/PE7）波特率
          long: |-
            SERIAL7 直接映射到物理串口 UART7，引脚为 PE8/PE7。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 57600
        values: *serial_baud_values
      SERIAL7_FUNCTION:
        description:
          short: SERIAL7（UART7 PE8/PE7）功能分配
          long: |-
            选择物理串口 UART7 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: *serial_function_values

      SERIAL8_BAUD:
        description:
          short: SERIAL8（UART8 PE1/PE0）波特率
          long: |-
            SERIAL8 直接映射到物理串口 UART8，引脚为 PE1/PE0。
            此值是在没有协议驱动占用端口时使用的普通 8N1 波特率。
        type: enum
        default: 115200
        values: *serial_baud_values
      SERIAL8_FUNCTION:
        description:
          short: SERIAL8（UART8 PE1/PE0）功能分配
          long: |-
            选择物理串口 UART8 的唯一运行期使用者。可用功能仅限 SBUS 和 GPS；
            每种功能最多只能占用一个端口。
        type: enum
        default: 0
        values: *serial_function_values
