module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_GPS_CTRL:
      category: Developer
      description:
        short: GNSS 辅助观测融合控制
        long: |-
          将对应位置的位设为 1 可启用相应融合：
          位 0：经纬度融合。
          位 1：高度融合。
          位 2：三维速度融合。
          位 3：双天线航向融合。
      type: bitmask
      bit:
        0: Lon/lat
        1: Altitude
        2: 3D velocity
        3: Dual antenna heading
      default: 7
      min: 0
      max: 15
    EKF2_GPS_MODE:
      category: Developer
      description:
        short: 融合重置模式
        long: |-
          自动模式：融合超时且没有其他位置源时执行重置。
          航位推算模式：融合超时且没有速度源时执行重置。
      type: enum
      values:
        0: Automatic
        1: Dead-reckoning
      default: 0
    EKF2_GPS_DELAY:
      category: Developer
      description:
        short: GPS 测量相对于 IMU 测量的延迟
      type: float
      default: 110
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_GPS_P_NOISE:
      category: Developer
      description:
        short: GNSS 位置测量噪声
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKF2_GPS_P_GATE:
      category: Developer
      description:
        short: GNSS 位置融合的新息门限
        long: |-
          设置新息一致性检查所使用的标准差倍数。
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_V_GATE:
      category: Developer
      description:
        short: GNSS 速度融合的新息门限
        long: |-
          设置新息一致性检查所使用的标准差倍数。
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_V_NOISE:
      category: Developer
      description:
        short: GNSS 速度测量噪声
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_GPS_POS_X:
      description:
        short: GPS 天线在机体系中的 X 轴位置
        long: |-
          以车辆重心为原点，X 轴为横滚轴，正方向朝前。
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_GPS_POS_Y:
      description:
        short: GPS 天线在机体系中的 Y 轴位置
        long: |-
          以车辆重心为原点，Y 轴为俯仰轴，正方向朝右。
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_GPS_POS_Z:
      description:
        short: GPS 天线在机体系中的 Z 轴位置
        long: |-
          以车辆重心为原点，Z 轴为偏航轴，正方向朝下。
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_GPS_CHECK:
      category: Developer
      description:
        short: GPS 健康检查位掩码
        long: |-
          各项检查的阈值由该检查旁标注的参数定义。
          漂移和偏移检查仅在车辆处于地面且静止时运行。
      type: bitmask
      bit:
        0: Sat count (EKF2_REQ_NSATS)
        1: PDOP (EKF2_REQ_PDOP)
        2: EPH (EKF2_REQ_EPH)
        3: EPV (EKF2_REQ_EPV)
        4: Speed accuracy (EKF2_REQ_SACC)
        5: Horizontal position drift (EKF2_REQ_HDRIFT)
        6: Vertical position drift (EKF2_REQ_VDRIFT)
        7: Horizontal speed offset (EKF2_REQ_HDRIFT)
        8: Vertical speed offset (EKF2_REQ_VDRIFT)
        9: Spoofing
        10: GPS fix type (EKF2_REQ_FIX)
      default: 2047
      min: 0
      max: 2047
    EKF2_REQ_EPH:
      category: Developer
      description:
        short: 使用 GPS 允许的最大水平位置误差（EPH）
      type: float
      default: 3.0
      min: 2
      max: 100
      unit: m
      decimal: 1
    EKF2_REQ_EPV:
      category: Developer
      description:
        short: 使用 GPS 允许的最大垂直位置误差（EPV）
      type: float
      default: 5.0
      min: 2
      max: 100
      unit: m
      decimal: 1
    EKF2_REQ_SACC:
      category: Developer
      description:
        short: 使用 GPS 允许的最大速度误差
      type: float
      default: 0.5
      min: 0.5
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_REQ_NSATS:
      category: Developer
      description:
        short: 使用 GPS 所需的最少卫星数
      type: int32
      default: 6
      min: 4
      max: 12
    EKF2_REQ_PDOP:
      category: Developer
      description:
        short: 使用 GPS 允许的最大位置精度衰减因子（PDOP）
      type: float
      default: 2.5
      min: 1.5
      max: 5.0
      decimal: 1
    EKF2_REQ_HDRIFT:
      category: Developer
      description:
        short: 使用 GPS 允许的最大水平漂移速度
      type: float
      default: 0.1
      min: 0.1
      max: 1.0
      unit: m/s
      decimal: 2
    EKF2_REQ_VDRIFT:
      category: Developer
      description:
        short: 使用 GPS 允许的最大垂直漂移速度
      type: float
      default: 0.2
      min: 0.1
      max: 1.5
      decimal: 2
      unit: m/s
    EKF2_REQ_FIX:
      category: Developer
      description:
        short: 使用 GPS 所需的定位解类型
        long: |-
          使用 GPS 所需的最低定位解类型。
      type: enum
      values:
        0: No fix required
        2: 2D fix
        3: 3D fix
        4: RTCM code differential
        5: RTK float
        6: RTK fixed
        8: Extrapolated
      default: 3
    EKF2_REQ_GPS_H:
      category: Developer
      description:
        short: 启动时 GPS 健康状态的持续时间要求
        long: |-
          将 GPS 标记为健康之前，要求连续无 GPS 故障的最短时间。
          减小此值可加快初始化，但车辆使用时建议保持原值。
      type: float
      default: 10.0
      min: 0.1
      decimal: 1
      unit: s
      reboot_required: true
