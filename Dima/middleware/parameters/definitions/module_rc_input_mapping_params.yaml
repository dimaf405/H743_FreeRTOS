module_name: definitions
parameters:
- group: Compatibility
  definitions:
    COM_RC_IN_MODE:
      category: System
      description:
        short: 手动控制输入来源策略
        long: |-
          Dima 当前唯一已实现的手动控制来源是本地 RC/SBUS 链路。
          在其他控制来源链路实现前，不接受选择 MAVLink 或禁用遥控的取值。
      type: enum
      values:
        0: RC only
      default: 0
      min: 0
      max: 0
- group: Commander
  definitions:
    COM_RC_LOSS_T:
      description:
        short: 遥控信号丢失判定超时
      type: float
      default: 0.5
      unit: s
      min: 0.1
      max: 35
      increment: 0.1
    COM_FLTMODE${i}:
      description:
        short: 模式槽 ${i}
        long: |-
          选择主遥控模式通道位于此槽时应用的模式。
          自动校准仅在上锁状态下接受，绝不会隐式解锁车辆。
          保留/未分配选项不触发模式动作。
      type: enum
      values:
        -1: Calibration Reserved / Unassigned
        0: Manual
        3: Mission
        23: Auto Calibration
      instance_start: 1
      num_instances: 6
      default: -1
- group: Compatibility
  definitions:
    RC_MAP_ROLL:
      category: System
      description:
        short: QGC 横滚通道配置完成标记
        long: |-
          固定的非零标记，仅用于满足原版 QGC 四轴遥控配置检查。
          差速车运行期控制不使用此映射。
      type: enum
      values:
        2: Channel 2
      default: 2
      min: 2
      max: 2
    RC_MAP_PITCH:
      category: System
      description:
        short: QGC 俯仰通道配置完成标记
        long: |-
          固定的非零标记，仅用于满足原版 QGC 四轴遥控配置检查。
          差速车运行期控制不使用此映射。
      type: enum
      values:
        1: Channel 1
      default: 1
      min: 1
      max: 1
