module_name: definitions
parameters:
- group: Commander
  definitions:
    COM_RC_IN_MODE:
      description:
        short: Manual control input source policy
        long: |-
          Dima currently has one production manual-control source: the local RC/SBUS
          pipeline.  Values which select MAVLink or disable RC are deliberately not
          accepted until those control-source paths exist.
      type: enum
      values:
        0: RC only
      default: 0
      min: 0
      max: 0
    COM_RC_LOSS_T:
      description:
        short: COM_RC_LOSS_T
      type: float
      default: 0.5
      unit: s
      min: 0.1
      max: 35
      increment: 0.1
