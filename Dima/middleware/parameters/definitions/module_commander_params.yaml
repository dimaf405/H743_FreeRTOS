module_name: definitions
parameters:
- group: Commander
  definitions:
    COM_ARM_STICK_DZ:
      category: Developer
      description:
        short: "运动校准解锁时 throttle/yaw 相对中位允许的最大归一化偏差。"
        long: "仅用于运动校准模式的解锁检查；手动模式解锁不检查摇杆居中。"
      type: float
      default: 0.1
      min: 0.0
      max: 0.5
      increment: 0.01
      decimal: 2
    COM_ACT_LOSS_T:
      description:
        short: Actuator command loss timeout
        long: |-
          Maximum age of both the actuator command publication and its original
          input sample before the physical PWM backend returns to safe-off.
      type: float
      default: 0.1
      unit: s
      min: 0.02
      max: 1.0
      increment: 0.01
      decimal: 2
