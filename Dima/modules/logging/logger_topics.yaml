  estimator_status:
    disposition: record
    profiles: {GeneralRover: 5}
  estimator_status_flags:
    disposition: record
    profiles: {GeneralRover: source}
  input_rc:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 50}
  manual_control_setpoint:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 50}
  manual_control_switches:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 50}
  mavlink_log:
    disposition: text
  parameter_update:
    disposition: parameter_trigger
  rc_channels:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 50}
  rover_motion_request:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 50}
  rover_control_status:
    disposition: record
    profiles: {GeneralRover: 20, RoverSystemIdentification: 100}
  rover_navigation_status:
    disposition: record
    profiles: {GeneralRover: 10, RoverSystemIdentification: 50}
  rtk_heading_status:
    disposition: record
    profiles: {GeneralRover: 10, RoverSystemIdentification: 10}
  sensor_accel:
