  estimator_aid_src_gnss_vel:
    disposition: record
    profiles: {GeneralRover: 5}
  estimator_aid_src_gnss_yaw:
    disposition: record
    profiles: {GeneralRover: 5}
  estimator_aid_src_gravity:
    disposition: record
    profiles: {GeneralRover: 5}
  estimator_aid_src_mag:
    disposition: record
    profiles: {GeneralRover: 5}
  estimator_event_flags:
