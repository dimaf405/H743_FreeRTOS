version: 1

# PX4 v1.17.0 px4_custom_mode.h @ d6f12ad1：main/sub 是 opaque custom_mode
# 的产品投影策略，编号只在此权威输入定义，收发端共同消费生成常量。
px4_custom_modes:
  Manual:
    main: 1
    sub: 0
    nav_state: NAVIGATION_STATE_MANUAL
    name: Manual
    standard_mode: MAV_STANDARD_MODE_NON_STANDARD
    properties: []
  AutoMission:
    main: 4
    sub: 4
    nav_state: NAVIGATION_STATE_AUTO_MISSION
    name: Mission
    standard_mode: MAV_STANDARD_MODE_MISSION
    properties: []
  AutoLoiter:
    main: 4
    sub: 3
    nav_state: NAVIGATION_STATE_AUTO_LOITER
    name: Hold
    standard_mode: MAV_STANDARD_MODE_NON_STANDARD
    properties: [MAV_MODE_PROPERTY_NOT_USER_SELECTABLE]
  AutoCalibration:
    main: 4
    sub: 11
    nav_state: NAVIGATION_STATE_EXTERNAL1
    name: Auto Calibration
    standard_mode: MAV_STANDARD_MODE_NON_STANDARD
    properties: []
  Termination:
    main: 10
    sub: 0
    nav_state: NAVIGATION_STATE_TERMINATION
    name: Termination
    standard_mode: MAV_STANDARD_MODE_NON_STANDARD
    properties: [MAV_MODE_PROPERTY_NOT_USER_SELECTABLE]

# 该文件定义 Dima 的模式投影、发送频率、调度阶段和业务 handler。
# wire ID、CRC、payload 字段及编解码规则始终由 dima.xml + mavgen.py 决定。
outbound:
  - message: HEARTBEAT
    handler: Heartbeat
    requestable: true
    scheduler: heartbeat
    default_interval_us: 1000000
    interval_configurable: false

  - message: AUTOPILOT_VERSION
    handler: AutopilotVersion
    requestable: true
    scheduler: none

  - message: PROTOCOL_VERSION
    handler: ProtocolVersion
    requestable: true
    scheduler: none

  # 静态模式目录使用官方 Standard Modes 服务；不新增私有 wire 消息。
  - message: AVAILABLE_MODES
    handler: AvailableModes
    requestable: true
    scheduler: none

  - message: CURRENT_MODE
    handler: CurrentMode
    requestable: true
    scheduler: service
    tx_stage: pre_metadata
    default_interval_us: 2000000
    interval_configurable: true

  - message: COMPONENT_METADATA
    handler: ComponentMetadata
    requestable: true
    scheduler: none

  - message: COMPONENT_INFORMATION
    handler: ComponentInformation
    requestable: true
    scheduler: none

  - message: STORAGE_INFORMATION
    handler: StorageInformation
    requestable: true
    scheduler: none

  - message: RC_CHANNELS
    handler: RcChannels
    requestable: true
    scheduler: service
    tx_stage: pre_metadata
    default_interval_us: 200000
    interval_configurable: true

  - message: HIGHRES_IMU
    handler: HighresImu
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 20000
    interval_configurable: true

  - message: SCALED_IMU
    handler: ScaledImu
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 40000
    interval_configurable: true

  - message: GPS_RAW_INT
    handler: GpsRawInt
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 200000
    interval_configurable: true

  - message: SYS_STATUS
    handler: SystemStatus
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 1000000
    interval_configurable: true

  - message: ATTITUDE
    handler: Attitude
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 20000
    interval_configurable: true

  - message: LOCAL_POSITION_NED
    handler: LocalPositionNed
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 33333
    interval_configurable: true

  - message: GLOBAL_POSITION_INT
    handler: GlobalPositionInt
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 100000
    interval_configurable: true

  - message: ESTIMATOR_STATUS
    handler: EstimatorStatus
    requestable: true
    scheduler: service
    tx_stage: post_metadata
    default_interval_us: 200000
    interval_configurable: true

inbound:
  - message: PARAM_REQUEST_LIST
    handler: ParameterList

  - message: PARAM_REQUEST_READ
    handler: Parameters

  - message: PARAM_SET
    handler: Parameters

  - message: PARAM_EXT_REQUEST_READ
    handler: Parameters

  - message: COMMAND_LONG
    handler: Commands

  - message: COMMAND_INT
    handler: Commands

  - message: SET_MODE
    handler: Commands

  - message: MISSION_REQUEST_LIST
    handler: Mission

  - message: MISSION_COUNT
    handler: Mission

  - message: MISSION_ITEM_INT
    handler: Mission

  - message: MISSION_REQUEST_INT
    handler: Mission

  - message: MISSION_SET_CURRENT
    handler: Mission

  - message: MISSION_CLEAR_ALL
    handler: Mission

  - message: MISSION_ACK
    handler: Mission

  - message: LOG_REQUEST_LIST
    handler: LogTransfer

  - message: LOG_REQUEST_DATA
    handler: LogTransfer

  - message: LOG_REQUEST_END
    handler: LogTransfer

  - message: LOG_ERASE
    handler: LogTransfer

  - message: FILE_TRANSFER_PROTOCOL
    handler: MetadataFtp

  - message: TIMESYNC
    handler: Timesync

  - message: PING
    handler: Ping
